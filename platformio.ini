[platformio]
default_envs = esp8266

[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
build_flags = -Isrc
extra_scripts =
    pre:tools/gen_clangd.py
    post:tools/compiledb_hook.py

lib_deps =
    adafruit/Adafruit ILI9341@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.0
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.0
    bblanchon/ArduinoJson@^7.0.0
    tcmenu/TaskManagerIO@^1.5.0

[env:native]
platform = native
test_framework = googletest
build_flags =
    -std=gnu++17
    -Isrc
    -Itest/fakes
lib_deps =
    googletest
test_build_src = no

